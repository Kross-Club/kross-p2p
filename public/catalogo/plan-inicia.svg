<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Plan Inicia — app instalable de tu marca">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060C1A"/><stop offset="1" stop-color="#0D2A46"/>
    </linearGradient>
    <linearGradient id="ac" x1="300" y1="120" x2="520" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A5E9FF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="640" cy="120" r="180" fill="#38BDF8" opacity=".12"/>
  <circle cx="140" cy="520" r="140" fill="#A5E9FF" opacity=".08"/>
  <!-- Teléfono con la tienda instalada -->
  <rect x="318" y="120" width="200" height="330" rx="30" fill="#0B1830" stroke="url(#ac)" stroke-width="6"/>
  <rect x="352" y="168" width="132" height="70" rx="14" fill="url(#ac)" opacity=".9"/>
  <rect x="352" y="256" width="60" height="60" rx="12" fill="#ffffff" opacity=".22"/>
  <rect x="424" y="256" width="60" height="60" rx="12" fill="#ffffff" opacity=".22"/>
  <rect x="352" y="334" width="132" height="20" rx="10" fill="#ffffff" opacity=".16"/>
  <rect x="352" y="374" width="132" height="38" rx="19" fill="#22C55E"/>
  <text x="400" y="512" font-family="Nunito, Verdana, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">Plan Inicia</text>
  <text x="400" y="552" font-family="Nunito, Verdana, sans-serif" font-size="24" font-weight="600" fill="#7DE8FF" text-anchor="middle">App instalable de tu marca</text>
</svg>
