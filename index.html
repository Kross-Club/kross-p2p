<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/api/manifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kross" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Kross · La tecnología de tu tienda</title>
    <!-- Estos metadatos describen a KROSS, o sea el host de la plataforma
         (krossclub.app). `index.html` es estático y lo sirve también cada
         subdominio de marca, así que la vista previa de un enlace compartido
         de `marca.krossclub.app` sale con este texto: es la deuda anotada en
         `docs/04-CUMPLIMIENTO-WEB.md`. El manifest sí es por marca, lo resuelve
         `api/manifest.js` leyendo el Host. -->
    <meta name="description" content="Kross es la tecnología de tu tienda: cobra la mitad o el total del pedido con Yape dentro del mismo formulario, validado automáticamente, y despacha solo lo que ya está cobrado. Software peruano por suscripción." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kross" />
    <meta property="og:title" content="Kross · La tecnología de tu tienda" />
    <meta property="og:description" content="Cobra la mitad o el total del pedido con Yape en el mismo formulario, validado solo. Al despacho entra lo que ya está cobrado." />
    <meta property="og:url" content="https://krossclub.app/" />
    <meta property="og:locale" content="es_PE" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* Nunito es la tipografía de las pantallas de MARCA (tienda, checkout,
         chat del comprador, web pública). El panel del vendedor va en Inter:
         lo cambia index.css bajo `[data-theme]`, ver manual de marca §5. */
      * { font-family: 'Nunito', sans-serif; }
    </style>
    <script>
      /* El tema del panel, ANTES del primer pintado: sin esto la app entra en
         blanco y salta a oscuro cuando React monta. Espejo de src/lib/theme.ts;
         a partir de ahí manda usePanelTheme(). */
      (function () {
        try {
          var pref = localStorage.getItem('kross-theme') || 'dark'
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (/^\/(vendedor|comprador)(\/|$)/.test(location.pathname)) {
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          }
        } catch (e) { /* sin storage: el panel se pinta al montar */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
